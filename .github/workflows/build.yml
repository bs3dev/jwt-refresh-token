name: Build, Test, Pack All and Conditional Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:
    branches: [ main ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
    - name: 🧱 Checkout repository
      uses: actions/checkout@v4

    - name: 🧰 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - name: 📦 Restore dependencies
      run: dotnet restore ./src/Jwt.Refresh.Token.sln

    - name: 🔧 Build all projects (including dependencies)
      run: dotnet build ./src --configuration Release --no-restore

    - name: ✅ Run unit tests
      run: dotnet test ./src/Tests/Jwt.Refresh.Token.Tests.Unit --no-build --configuration Release

    - name: 📦 Pack NuGet packages (Application, Domain, Infra.Cosmos)
      run: |
        mkdir -p artifacts
        if [[ "${{ github.ref_type }}" == "tag" ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="0.0.0-preview"
        fi

        for proj in           ./src/Application/Jwt.Refresh.Token.Application/Jwt.Refresh.Token.Application.csproj           ./src/Domain/Jwt.Refresh.Token.Domain/Jwt.Refresh.Token.Domain.csproj           ./src/Infrastructure/Jwt.Refresh.Token.Infra.Cosmos/Jwt.Refresh.Token.Infra.Cosmos.csproj
        do
          dotnet pack "$proj"             --configuration Release --output ./artifacts             -p:PackageVersion=$VERSION
        done

    - name: 📂 Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: jwt-refresh-token-nugets
        path: artifacts/*.nupkg

    - name: 🚀 Publish packages to NuGet.org
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet nuget push artifacts/*.nupkg           --api-key ${{ secrets.NUGET_API_KEY }}           --source https://api.nuget.org/v3/index.json
