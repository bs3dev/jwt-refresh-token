name: Build and Pack NuGet

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
    - name: 🧱 Checkout repository
      uses: actions/checkout@v3

    - name: 🧰 Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x' # ou 9.x se você já estiver com preview

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🔧 Build solution
      run: dotnet build --configuration Release --no-restore

    - name: ✅ Run unit tests
      run: dotnet test ./tests/Jwt.Refresh.Token.Tests.Unit --no-build --configuration Release

    - name: 📦 Create NuGet package (Infra.Cosmos only)
      run: dotnet pack ./src/Jwt.Refresh.Token.Infra.Cosmos --no-build --configuration Release --output ./artifacts

    - name: 📂 Upload package artifact
      uses: actions/upload-artifact@v3
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
